name: CI

# Docs-only pushes and PRs skip CI (see paths-ignore). Release tags build because their commit
# always carries code/Makefile changes; a docs-only tag would need a manual run (workflow_dispatch).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

jobs:
  build:
    name: Test and build router binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Test
        run: make test
      - name: Build
        run: make spoofd VERSION=${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: spoofd
          path: dist/

  release:
    name: Release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: spoofd
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

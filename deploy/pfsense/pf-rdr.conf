# pf redirect for spoofd, for a plain FreeBSD/pf setup.
# On pfSense itself, prefer the GUI (Firewall > NAT > Port Forward) — see docs/pfsense-setup.md —
# because pfSense regenerates its pf ruleset and would drop hand-added rules.
#
# Replace $ts_if with your Tailscale interface (usually tailscale0, or the assigned OPT name).
#
# Send HTTPS from exit-node clients towards Apple's address block to spoofd:
rdr on $ts_if inet proto tcp from any to 17.0.0.0/8 port 443 -> 127.0.0.1 port 18443
# Allow the redirected traffic and the status/CA port:
pass in quick on $ts_if inet proto tcp from any to 127.0.0.1 port 18443
pass in quick on $ts_if inet proto tcp from any to (self) port 18080
